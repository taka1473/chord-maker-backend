name: Deploy to Compute Engine via Kamal

on:
  push:
    branches: [main]

# 同時に 1 つのデプロイのみ実行(後続は待機)。並行デプロイによるロック競合を防ぐ
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # for pushing to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking=no" > ~/.ssh/config

      # ディスク使用率が 85% を超えていたら、デプロイ前に停止済みコンテナと
      # 未使用イメージを削除して空きを確保する(ディスクフルによるデプロイ失敗の予防)
      - name: Ensure disk space
        run: |
          ssh github-actions@136.113.210.132 '
            usage=$(df / --output=pcent | tail -1 | tr -dc "0-9")
            echo "Disk usage: ${usage}%"
            if [ "$usage" -ge 85 ]; then
              echo "Disk usage is high, pruning stopped containers and unused images..."
              docker container prune -f
              docker image prune -af
              df -h /
            fi
          '

      - name: Bootstrap server (install Docker if needed)
        run: bin/kamal server bootstrap

      - name: Deploy with Kamal
        run: bin/kamal deploy
        env:
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_PRODUCTION_MASTER_KEY }}
          LITESTREAM_GCS_BUCKET: ${{ secrets.LITESTREAM_GCS_BUCKET }}
