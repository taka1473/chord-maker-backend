# サーバーの状態(ディスク・Docker・ファイルシステム)を確認するための診断ワークフロー。
# GitHub Actions の "Run workflow" から実行する。
name: Server diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking=no" > ~/.ssh/config

      - name: Run diagnostics
        run: |
          ssh github-actions@136.113.210.132 '
            echo "=== df -h ==="
            df -h
            echo "=== df -i (inodes) ==="
            df -i
            echo "=== root mount flags ==="
            grep " / " /proc/mounts
            echo "=== mkdir test ==="
            if mkdir .kamal/lock-test 2>&1; then echo "mkdir OK"; rmdir .kamal/lock-test; else echo "mkdir FAILED"; fi
            echo "=== ls .kamal ==="
            ls -la .kamal/ || true
            echo "=== docker system df ==="
            docker system df || true
            echo "=== docker ps ==="
            docker ps --all --format "table {{.Names}}\t{{.Status}}\t{{.Size}}" || true
            echo "=== memory ==="
            free -m || true
          '
